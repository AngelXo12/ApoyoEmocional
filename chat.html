<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habla con un Bot</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Patrick+Hand&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <h1>Habla con un Bot</h1>
    <p class="tagline">Dile lo que sientes y recibe palabras de aliento.</p>
    <nav>
      <a href="index.html">Volver al Inicio</a>
    </nav>
  </header>

  <main class="main-content">
    <section class="chat-section">
      <div id="chat-box">
        <!-- Aquí se mostrarán los mensajes -->
      </div>

      <div class="chat-input">
        <textarea id="user-message" placeholder="Escribe aquí..."></textarea>
        <button id="send-message-btn">Enviar</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Creado con ❤️ para quien lo necesite</p>
  </footer>

  <script src="chat.js"></script>
</body>
</html>
